<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- `user-scalable=no` was removed: it blocks pinch-to-zoom, which fails
         WCAG 2.1 SC 1.4.4 (Resize Text) and is flagged by Play Store
         accessibility guidance. This app's users are frequently outdoors, in
         gloves, or over 40 — zoom matters. `maximum-scale` is likewise omitted
         because iOS treats it as a zoom lock. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Matches --background in the dark theme (index.css). Previously #0f1419,
         which matched nothing in the app and seamed against the real shell. -->
    <meta name="theme-color" content="#002420" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f5f5" media="(prefers-color-scheme: light)" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <title>TradieMate - Job Management for Trades</title>
    <meta name="description" content="TradieMate helps tradespeople manage quotes, jobs, and invoices on the go. Built for electricians, plumbers, carpenters, and more." />
    <meta name="author" content="TradieMate" />
    <meta name="keywords" content="trades, tradesperson, quotes, invoices, jobs, electrician, plumber, carpenter, builder" />

    <meta property="og:title" content="TradieMate - Job Management for Trades" />
    <meta property="og:description" content="Manage your quotes, jobs, and invoices on the go. Built for tradespeople." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@TradieMate" />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Fonts are bundled locally via @fontsource (imported at the top of
         src/index.css), not fetched from the Google Fonts CDN.

         This app ships a full offline layer and tells users on the onboarding
         screen that it "works offline". Webfonts loaded over the network break
         that promise silently: on a cold offline start the request fails and
         the entire typographic identity falls back to system-ui. In a Capacitor
         WebView there is also no guarantee of connectivity at all. -->
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
